<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CharlesXu - AI & CV Developer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'JetBrains Mono', monospace;
        }

        #banner-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            pointer-events: none;
            mix-blend-mode: difference;
        }

        h1 {
            /* 修改：缩小字体 4rem -> 3.2rem */
            font-size: 3.2rem;
            margin: 0;
            letter-spacing: -2px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            white-space: nowrap;
        }

        p {
            /* 修改：缩小字体 1.2rem -> 1rem */
            font-size: 1rem;
            color: #00f2ea;
            margin-top: 10px;
            opacity: 0.8;
        }

        /* --- 核心调整区域 --- */
        .cv-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            
            /* 修改：缩小框体尺寸 420/180 -> 340/145 */
            width: 340px; 
            height: 145px;
            
            border: 2px solid #00ff41;
            z-index: 3;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
            animation: scan 3s infinite ease-in-out;
            pointer-events: none;
            display: block; 
        }

        .cv-label {
            position: absolute;
            left: -2px; 
            top: -2px;
            
            background-color: #00ff41;
            color: #000;
            
            /* 修改：缩小标签字体 0.8rem -> 0.65rem */
            font-size: 0.65rem;
            
            font-weight: bold;
            padding: 2px 6px;
            white-space: nowrap;
            
            /* 保持你的修复逻辑：+2px 覆盖边框 */
            transform: translateY(calc(-100% + 2px));
            
            box-shadow: 0 -2px 5px rgba(0, 255, 65, 0.2);
            z-index: 10; 
        }

        /* 修改：动画参数按比例缩小 */
        @keyframes scan {
            0% { 
                width: 325px;   /* 原 400 */
                height: 130px;  /* 原 160 */
                opacity: 0.8; 
            }
            50% { 
                width: 355px;   /* 原 440 */
                height: 160px;  /* 原 200 */
                opacity: 1; 
                border-color: #00f2ea; 
            }
            100% { 
                width: 325px; 
                height: 130px; 
                opacity: 0.8; 
            }
        }

        @keyframes label-color-change {
            0% { background-color: #00ff41; }
            50% { background-color: #00f2ea; }
            100% { background-color: #00ff41; }
        }
        
        .cv-label {
            animation: label-color-change 3s infinite ease-in-out;
        }

        .cv-corner {
            position: absolute;
            /* 修改：角落图标缩小 15px -> 12px */
            width: 12px;
            height: 12px;
            background: #00ff41;
            animation: label-color-change 3s infinite ease-in-out;
        }
        .tl { top: -2px; left: -2px; } 
        .tr { top: -2px; right: -2px; }
        .bl { bottom: -2px; left: -2px; }
        .br { bottom: -2px; right: -2px; }

        /* 修改：移动端适配同步缩小 */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; } /* 原 2.5 */
            .cv-overlay { width: 225px; height: 100px; } /* 原 280/120 */
            @keyframes scan {
                0% { width: 210px; height: 90px; }
                50% { width: 240px; height: 115px; }
                100% { width: 210px; height: 90px; }
            }
        }
    </style>
</head>
<body>

<div id="banner-container">
    <canvas id="networkCanvas"></canvas>

    <div class="cv-overlay">
        <div class="cv-label">Object: CharlesXu [99.8%]</div>
        <div class="cv-corner tl"></div>
        <div class="cv-corner tr"></div>
        <div class="cv-corner bl"></div>
        <div class="cv-corner br"></div>
    </div>

    <div class="content">
        <h1>Charles Xu</h1>
        <p>&lt; CS / AI / CV &gt;</p>
    </div>
</div>

<script>
    const canvas = document.getElementById('networkCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];

    const config = {
        particleCount: 80,
        connectionDistance: 150,
        mouseDistance: 200,
        particleColor: 'rgba(0, 242, 234, 0.7)',
        lineColor: 'rgba(0, 242, 234, 0.2)'
    };

    let mouse = { x: null, y: null };

    window.addEventListener('mousemove', (e) => {
        mouse.x = e.x;
        mouse.y = e.y;
    });

    window.addEventListener('resize', resize);

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initParticles();
    }

    class Particle {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 1.5;
            this.vy = (Math.random() - 0.5) * 1.5;
            this.size = Math.random() * 2 + 1;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > width) this.vx *= -1;
            if (this.y < 0 || this.y > height) this.vy *= -1;

            if (mouse.x != null) {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < config.mouseDistance) {
                    const forceDirectionX = dx / distance;
                    const forceDirectionY = dy / distance;
                    const force = (config.mouseDistance - distance) / config.mouseDistance;
                    this.x -= forceDirectionX * force * 2;
                    this.y -= forceDirectionY * force * 2;
                }
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = config.particleColor;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = window.innerWidth < 768 ? 40 : config.particleCount;
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
            for (let j = i; j < particles.length; j++) {
                let dx = particles[i].x - particles[j].x;
                let dy = particles[i].y - particles[j].y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < config.connectionDistance) {
                    ctx.beginPath();
                    ctx.strokeStyle = config.lineColor;
                    ctx.lineWidth = 1 - distance / config.connectionDistance;
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.stroke();
                }
            }
        }
        if(Math.random() > 0.95) {
            ctx.beginPath();
            const y = Math.random() * height;
            ctx.strokeStyle = 'rgba(0, 255, 65, 0.1)';
            ctx.lineWidth = 2;
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
        }
        requestAnimationFrame(animate);
    }

    resize();
    animate();
</script>

</body>
</html>
